
<!DOCTYPE html>
<html>
<head>
    <title>MovieZone</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #151515;
            color: white;
        }

        nav {
            background: #222;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        nav h2 {
            color: #ff4242;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .banner {
            background: #292929;
            text-align: center;
            padding: 60px 20px;
        }

        .banner h1 {
            font-size: 35px;
        }

        .banner button {
            background: #ff4242;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
        }

        .movies {
            padding: 30px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: #292929;
            width: 180px;
            text-align: center;
            border-radius: 10px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card:hover {
            transform: scale(1.05);
        }

        footer {
            background: #222;
            text-align: center;
            padding: 20px;
        }

        @media(max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .banner h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>MovieZone</h2>

        <div>
            <a href="#">Home</a>
            <a href="#movies">Movies</a>
            <a href="#about">About</a>
        </div>
    </nav>

    <div class="banner">
        <h1>Welcome to MovieZone</h1>
        <p>Watch your favourite movies anytime.</p>
        <button onclick="location.href='#movies'">
            Explore Movies
        </button>
    </div>

    <h2 style="text-align:center;">Popular Movies</h2>

    <div class="movies" id="movies">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=400">
            <h3>Action Movie</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400">
            <h3>Romantic Movie</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1503095396549-807759245b35?w=400">
            <h3>Horror Movie</h3>
        </div>

    </div>

    <footer id="about">
        <p>© 2026 MovieZone | All Rights Reserved</p>
    </footer>

</body>
</html>
