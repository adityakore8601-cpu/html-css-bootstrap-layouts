
<!DOCTYPE html>
<html>
<head>
    <title>Product Showcase Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        h2 {
            text-align: center;
            margin: 30px;
            color: #333;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }

        .product {
            width: 260px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px gray;
            position: relative;
            transition: 0.4s;
        }

        .product:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 20px gray;
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            padding: 15px;
            transition: 0.4s;
        }

        .product:hover img {
            transform: scale(1.1);
        }

        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: red;
            color: white;
            padding: 7px 12px;
            border-radius: 5px;
            font-size: 12px;
        }

        .details {
            padding: 15px;
            text-align: center;
        }

        .details h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        .old-price {
            color: gray;
            text-decoration: line-through;
            font-size: 14px;
        }

        button {
            background: #ff5722;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #d84315;
            transform: scale(1.1);
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 Online Shopping Store</h1>
    <p>Best Products at Best Prices</p>
</header>

<h2>Featured Products</h2>

<div class="container">

    <!-- Product 1 -->
    <div class="product">
        <span class="badge">20% OFF</span>

        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
             alt="Headphones">

        <div class="details">
            <h3>Wireless Headphones</h3>
            <p class="price">₹1,599</p>
            <p class="old-price">₹1,999</p>
            <button>Add to Cart</button>
        </div>
    </div>

    <!-- Product 2 -->
    <div class="product">
        <span class="badge">15% OFF</span>

        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
             alt="Watch">

        <div class="details">
            <h3>Smart Watch</h3>
            <p class="price">₹2,499</p>
            <p class="old-price">₹2,999</p>
            <button>Add to Cart</button>
        </div>
    </div>

    <!-- Product 3 -->
    <div class="product">
        <span class="badge">30% OFF</span>

        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
             alt="Shoes">

        <div class="details">
            <h3>Sports Shoes</h3>
            <p class="price">₹1,399</p>
            <p class="old-price">₹1,999</p>
            <button>Add to Cart</button>
        </div>
    </div>

    <!-- Product 4 -->
    <div class="product">
        <span class="badge">10% OFF</span>

        <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500"
             alt="Camera">

        <div class="details">
            <h3>Digital Camera</h3>
            <p class="price">₹8,999</p>
            <p class="old-price">₹9,999</p>
            <button>Add to Cart</button>
        </div>
    </div>

</div>

<footer>
    <p>© 2026 Online Shopping Store | All Rights Reserved</p>
</footer>

</body>
</html>
