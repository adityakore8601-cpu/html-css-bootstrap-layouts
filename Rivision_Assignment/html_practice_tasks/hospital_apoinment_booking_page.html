
<!DOCTYPE html>
<html>
<head>
    <title>Hospital Appointment Booking</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 50%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            color: #00796b;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #00796b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #004d40;
        }

        @media(max-width: 600px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏥 Hospital Appointment Form</h1>

    <form>

        <label>Patient Name:</label>
        <input type="text" placeholder="Enter patient name" required>

        <label>Age:</label>
        <input type="number" placeholder="Enter age" required>

        <label>Gender:</label>
        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Mobile Number:</label>
        <input type="tel" placeholder="Enter mobile number" required>

        <label>Email:</label>
        <input type="email" placeholder="Enter email">

        <label>Select Department:</label>
        <select required>
            <option value="">Select Department</option>
            <option>Cardiology</option>
            <option>Neurology</option>
            <option>Orthopedics</option>
            <option>Dermatology</option>
            <option>General Medicine</option>
        </select>

        <label>Select Doctor:</label>
        <select required>
            <option value="">Select Doctor</option>
            <option>Dr. Rahul Sharma</option>
            <option>Dr. Priya Patil</option>
            <option>Dr. Aditya Kore</option>
        </select>

        <label>Appointment Date:</label>
        <input type="date" required>

        <label>Symptoms:</label>
        <textarea placeholder="Enter your symptoms"></textarea>

        <label>Medical History:</label>
        <textarea placeholder="Enter medical history"></textarea>

        <button type="submit">Book Appointment</button>

    </form>
</div>

</body>
</html>
