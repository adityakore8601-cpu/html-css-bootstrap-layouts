
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="adi.css">
</head>
<body>

    <div class="dashboard">

        <header>
            <h2>My Dashboard</h2>
        </header>

        <nav>
            <h3>Navigation</h3>
            <p>Home</p>
            <p>Dashboard</p>
            <p>Profile</p>
            <p>Settings</p>
        </nav>

        <main>
            <h2>Main Content</h2>
            <p>Welcome to the My Dashboard!</p>
            <p>This is the main section of the dashboard.</p>
        </main>

        <aside>
            <h3>Aside</h3>
            <p>Notifications</p>
            <p>Recent Updates</p>
        </aside>

        <footer>
            <p>© 2026 My Dashboard</p>
        </footer>

    </div>

</body>
</html>
