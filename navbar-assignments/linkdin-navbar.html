
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Navbar</title>
    <link rel="stylesheet" href="linkdin-navbar.css">
</head>
<body>

    <nav class="navbar">
        <div class="left-section">
            <a href="#" class="logo">in</a>

            <input type="text" class="search"
                   placeholder="  Search">
        </div>

        <div class="nav-links">

            <a href="#" class="nav-item active">
                <span class="symbol">⌂</span>
                <span>Home</span>
            </a>

        <a href="#" class="nav-item">
                <span class="symbol">♧</span>
                <span>My Network</span>
                <span class="badge">6</span>
            </a>

            <a href="#" class="nav-item">
                <span class="symbol">☰</span>
                <span>Jobs</span>
            </a>

            <a href="#" class="nav-item">
                <span class="symbol">✉</span>
                <span>Messaging</span>
            </a>

            <a href="#" class="nav-item">
                <span class="symbol">🔔</span>
                <span>Notifications</span>
                <span class="badge">25</span>
            </a>

            <a href="#" class="nav-item">
                <span class="profile">A</span>
                <span>Me⌄</span>
            </a>

            <a href="#" class="nav-item business">
                <span class="symbol">🏢</span>
                <span>For Business⌄</span>
            </a>

            <a href="#" class="nav-item premium">
                <span class="premium-icon">★</span>
                <span>Try Premium for ₹0</span>
            </a>

        </div>
    </nav>

</body>
</html>
