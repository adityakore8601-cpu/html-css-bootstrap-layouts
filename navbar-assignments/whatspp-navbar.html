<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Navbar</title>
    <link rel="stylesheet" href="whatspp-navbar.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="profile-section">               
                <i class="fa-solid fa-users"></i>
            </div>

            <div class="profile-info">
                <h3>B101-WS-MERN-JF</h3>
                <p>Aditya, yash, harsh, You</p>
            </div>
        </div>
        <div class="navbar-actions">

            <button class="add-button">
                <i class="fa-solid fa-list-check"></i>      
            </button>

            <button class="icon-button" aria-label="Video call  options">
                <i class="fa-solid fa-video"></i>
                <i class="fa-solid fa-chevron-down arrow"></i>
            </button>

            <button class="icon-button" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button class="icon-button" aria-label="More options">
                <i class="fa-solid fa-ellipsis-horizontal"></i>
            </button>

        </div>
    </nav>
</body>
</html>
