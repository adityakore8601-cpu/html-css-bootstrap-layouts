
<!DOCTYPE html>
<html>
<head>
    <title>Personal Digital Identity Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 300px;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #667eea;
            object-fit: cover;
        }

        h2 {
            color: #333;
            margin-bottom: 5px;
        }

        h4 {
            color: #667eea;
            margin-top: 5px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        .social {
            margin-top: 20px;
        }

        .social a {
            display: inline-block;
            text-decoration: none;
            background: #667eea;
            color: white;
            padding: 10px;
            margin: 5px;
            border-radius: 50%;
            transition: 0.3s;
        }

        .social a:hover {
            background: #764ba2;
            transform: scale(1.2);
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #764ba2;
        }

    </style>
</head>

<body>

    <div class="card">

        <img src="C:\Users\ASUS\Downloads\WhatsApp Image 2026-10-10 at 8.39.04 PM.jpeg" alt="Profile Photo">

        <h2>Aditya Kore</h2>

        <p>
            I am a Computer Science Engineering student
            interested in Python, Web Development,
            Data Science and Machine Learning.
        </p>

        <div class="social">
            <a href="https://www.facebook.com/" target="_blank">f</a>
            <a href="https://www.instagram.com/" target="_blank">I</a>
            <a href="https://www.linkedin.com/in/aditya-kore-5b32a6321/" target="_blank">in</a>
            <a href="https://github.com/adityakore8601-cpu" target="_blank">G</a>
        </div>

        <button>View Profile</button>

    </div>

</body>
</html>
